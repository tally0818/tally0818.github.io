<script type="module" src="{{ base_path }}/assets/js/main.min.js"></script>

<script>
  document.querySelector('#theme-toggle a').addEventListener('keydown', function (event) {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      this.click();
    }
  });

  /* BibTeX one-click copy for publication entries. */
  document.addEventListener("click", function (event) {
    var btn = event.target.closest(".cite-btn");
    if (!btn) return;

    var entry = btn.closest(".pub-entry");
    var source = entry && entry.querySelector(".pub-bibtex");
    if (!source) return;

    var bibtex = source.textContent.trim();
    btn.dataset.label = btn.dataset.label || btn.textContent;
    btn.setAttribute('aria-live', 'polite');
    var failed = function () {
      source.hidden = false;
      source.setAttribute('tabindex', '0');
      source.focus();
      btn.textContent = 'Select citation below';
    };

    var done = function () {
      var original = btn.dataset.label || btn.textContent;
      btn.dataset.label = original;
      btn.textContent = "copied!";
      btn.classList.add("is-copied");
      window.clearTimeout(btn._resetTimer);
      btn._resetTimer = window.setTimeout(function () {
        btn.textContent = original;
        btn.classList.remove("is-copied");
      }, 1600);
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(bibtex).then(done, function () {
        fallbackCopy(bibtex, done, failed);
      });
    } else {
      fallbackCopy(bibtex, done, failed);
    }
  });

  function fallbackCopy(text, onDone, onFailure) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "absolute";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    var copied = false;
    try {
      copied = document.execCommand("copy");
    } catch (e) {
      /* no-op */
    }
    document.body.removeChild(ta);
    if (copied) onDone();
    else onFailure();
  }
</script>
