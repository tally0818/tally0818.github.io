---
layout: compress
---
{% include base_path %}
<!doctype html>
<html lang="en" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>
  <body class="editorial-site">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <nav class="site-nav site-width" aria-label="Main navigation">
        <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Chanuk Lee home">Chanuk Lee</a>
        <div class="nav-links">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>About</a>
          <a href="{{ '/publications/' | relative_url }}"{% if page.url == '/publications/' %} aria-current="page"{% endif %}>Publications</a>
          <a href="{{ '/files/ChanukLeeCV.pdf' | relative_url }}">CV</a>
          <button class="theme-switch" type="button" aria-label="Switch to dark theme" aria-pressed="false">
            <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20.7 13A8.8 8.8 0 0 1 11 3.3 8.8 8.8 0 1 0 20.7 13Z"/></svg>
            <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
          </button>
        </div>
      </nav>
    </header>
    <main id="main" class="site-width" tabindex="-1">{{ content }}</main>
    <footer class="site-footer site-width">
      <div class="footer-signature">Chanuk Lee</div>
      <div class="footer-meta"><span>&copy; {{ site.time | date: '%Y' }}</span><span>Built with <a href="https://jekyllrb.com">Jekyll</a> &amp; <a href="https://github.com/academicpages/academicpages.github.io">AcademicPages</a></span></div>
    </footer>
    <script src="{{ '/assets/js/editorial.js' | relative_url }}" defer></script>
    {% include analytics.html %}
  </body>
</html>
